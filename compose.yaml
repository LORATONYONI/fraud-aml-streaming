# Local Kafka mode: a single-node Apache Kafka broker (KRaft, no ZooKeeper) and a web UI.
#   make kafka-up     start both, create the topics
#   make kafka-down   stop both and delete all Kafka data
# Nothing here runs on AWS or costs money.

name: fraud-aml

services:
  kafka:
    image: apache/kafka:4.3.2
    container_name: fraud-aml-kafka
    ports:
      - "9092:9092" # for the producer and detector on your laptop
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client listeners: localhost:9092 for your laptop, kafka:19092 for other containers.
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single broker: internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by `python -m fraud_aml.kafka.topics` (topics as code).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: fraud-aml-kafka-ui
    ports:
      - "8080:8080" # browse topics, messages and consumer-group lag at http://localhost:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: fraud-aml-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
